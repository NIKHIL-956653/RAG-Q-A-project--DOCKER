# Deterministic, offline baseline. Runs anywhere with no model download and no API key.
#
# Chunking and top_k match the legacy app (RecursiveCharacterTextSplitter 1000/200, k=3).
# Retrieval (BM25) and generation (extractive) STAND IN for the legacy MiniLM + Gemini
# components, so these numbers are a reproducible floor, not the legacy app's quality.
# See configs/baseline-legacy-dense.toml for the legacy retriever.

name = "baseline-offline"
description = "Legacy chunking (1000/200, k=3) with BM25 retrieval and the extractive answerer. Deterministic."
dataset = "../datasets/tarnwick-v1"

[chunking]
strategy = "recursive_character"
chunk_size = 1000
chunk_overlap = 200

[retrieval]
method = "bm25"
top_k = 3

[retrieval.bm25]
k1 = 1.2
b = 0.75

[generation]
provider = "extractive"

[generation.extractive]
max_sentences = 2
min_overlap = 0.5

[evaluation]
evidence_overlap = 0.5
cutoffs = [1, 3, 5, 10]
bootstrap_resamples = 10000
seed = 0
