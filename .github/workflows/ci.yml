name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Deterministic tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/dev.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.lock
          python -m pip install --no-deps -e .

      - name: Lint and format check
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check (mypy --strict)
        run: mypy

      - name: Validate evaluation dataset
        run: rag-lab validate-dataset datasets/tarnwick-v1

      - name: Unit, parity and golden-benchmark tests
        run: pytest -q

      - name: Run the offline baseline evaluation
        run: rag-lab eval --config configs/baseline-offline.toml --out reports/ci-baseline-offline

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-offline-report-py${{ matrix.python-version }}
          path: reports/ci-baseline-offline/
          if-no-files-found: ignore
